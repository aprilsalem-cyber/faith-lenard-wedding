<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding</title>

<style>
/* 🌸 BODY SETUP */
body {
  margin: 0;
  background: #f6eeee;
  overflow: hidden; /* disables scroll so buttons work perfectly */
}

/* 🌸 EACH PAGE FULL SCREEN */
.page {
  width: 100%;
  height: 100vh;
  display: none; /* hide by default */
  justify-content: center;
  align-items: center;
}

.active {
  display: flex; /* only active page shows */
}

/* 🌸 IMAGE FULL SCREEN */
.page img {
  width: 100vw;
  height: 100vh;
  object-fit: cover;
}

/* 🌸 ELEGANT NAVIGATION BUTTONS */
.nav {
  position: fixed;
  bottom: 30px;
  width: 100%;
  text-align: center;
  z-index: 1000;
}

button {
  padding: 12px 25px;
  margin: 0 10px;
  font-size: 18px;
  font-family: 'Arial', sans-serif;
  font-weight: bold;
  color: #fff;
  background: linear-gradient(145deg, #800020, #b3002d); /* shiny burgundy */
  border: none;
  border-radius: 25px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}
</style>
</head>

<body>

<!-- 🌸 PAGES -->
<div id="page1" class="page active">
  <img src="page1.png" alt="Page 1">
</div>
<div id="page2" class="page">
  <img src="page2.png" alt="Page 2">
</div>
<div id="page3" class="page">
  <img src="page3.png" alt="Page 3">
</div>
<div id="page4" class="page">
  <img src="page4.png" alt="Page 4">
</div>
<div id="page5" class="page">
  <img src="page5.png" alt="Page 5">
</div>

<!-- 🌸 NAVIGATION BUTTONS -->
<div class="nav">
  <button onclick="prevPage()">Previous</button>
  <button onclick="nextPage()">Next</button>
</div>

<script>
let current = 1;
let total = 5;

function showPage(num) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page' + num).classList.add('active');
}

function nextPage() {
  if (current < total) {
    current++;
    showPage(current);
  }
}

function prevPage() {
  if (current > 1) {
    current--;
    showPage(current);
  }
}
</script>

</body>
</html>
