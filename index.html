<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith & Lenard Wedding</title>

<style>
body {
  margin: 0;
  font-family: 'Georgia', serif;
  background: #f6eeee;
}

.page {
  display: none;
  width: 100%;
  height: 100vh;
  position: relative;
}

.active { display: block; }

/* FULL IMAGE BACKGROUND */
.bg {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* COUNTDOWN */
#countdown {
  position: absolute;
  top: 30px;
  right: 40px;
  color: #8b0000;
  font-weight: bold;
  font-size: 18px;
}

/* CLICK AREAS */
.clickable {
  position: absolute;
  cursor: pointer;
}

/* MOVING FINGER */
.finger {
  position: absolute;
  font-size: 40px;
  animation: bounce 1s infinite alternate;
}

@keyframes bounce {
  from { transform: translateY(0); }
  to { transform: translateY(12px); }
}

/* PAGE 3 BUTTON STYLE */
.btn {
  position: absolute;
  background: #6e1b1b;
  color: white;
  border-radius: 30px;
  padding: 15px 25px;
  cursor: pointer;
}

/* FORM */
.form-box {
  position: absolute;
  background: white;
  padding: 15px;
  border-radius: 10px;
}

</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
  <img src="page1.png" class="bg">

  <div id="countdown"></div>

  <!-- MAP CLICK -->
  <a href="https://maps.app.goo.gl/owUoDmKXqvL2LkbC7" target="_blank">
    <div class="clickable" style="top:60%; left:55%; width:80px; height:80px;"></div>
  </a>

  <!-- FINGER -->
  <div class="finger" style="top:58%; left:57%;">👇</div>

  <!-- RSVP BUTTON -->
  <div class="clickable" style="bottom:15%; left:45%; width:180px; height:60px;" onclick="goToPage(9)"></div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
  <img src="page2.png" class="bg">
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
  <img src="page3.png" class="bg">

  <!-- NAME -->
  <div class="clickable" style="top:35%; left:40%; width:200px; height:60px;" onclick="enterName()"></div>

  <!-- ATTEND -->
  <div class="clickable" style="top:50%; left:35%; width:300px; height:60px;" onclick="chooseAttendance()"></div>

  <!-- DIET -->
  <div class="clickable" style="top:65%; left:30%; width:350px; height:60px;" onclick="enterDiet()"></div>
</div>

<!-- PAGE 4 -->
<div id="page4" class="page">
  <img src="page4.png" class="bg">

  <!-- LETTER CLICK -->
  <div class="clickable" style="top:40%; left:40%; width:200px; height:200px;" onclick="openLetter()"></div>

  <div id="letterBox" class="form-box" style="top:35%; left:35%; display:none;">
    <input id="guestName" placeholder="Name"><br><br>
    <textarea id="guestMsg" placeholder="Message"></textarea><br>
    <button onclick="sendMessage()">Send Response</button>
  </div>
</div>

<!-- PAGE 5 -->
<div id="page5" class="page">
  <img src="page5.png" class="bg">

  <!-- GIFT CLICK -->
  <div class="clickable" style="top:60%; left:45%; width:150px; height:150px;"
    onclick="window.location.href='https://aprilsalem-cyber.github.io/gift-selection/?fbclid=IwY2xjawQ9-uBleHRuA2FlbQIxMABicmlkETFEU0ZaU2hZZ2l4UUdYWjBIc3J0YwZhcHBfaWQQMjIyMDM5MTc4ODIwMDg5MgABHiUs_PXEpfB5r7ColPOryZePnYTaL1-h1ki2qTcFmoAWMQam_a36i8R_0Kgv_aem_6WINKzTcXIpv5D3HlJx6xA'"></div>

  <div class="finger" style="top:58%; left:47%;">👇</div>
</div>

<!-- PAGE 9 -->
<div id="page9" class="page">
  <h2 style="text-align:center; margin-top:50px;">RSVP</h2>

  <div style="text-align:center;">
    <input id="rsvpName" placeholder="Your Name"><br><br>

    <select id="rsvpAttend">
      <option>Joyfully Accept</option>
      <option>Regretfully Decline</option>
    </select><br><br>

    <button onclick="submitRSVP()">Submit</button>
    <p id="thanks"></p>
  </div>
</div>

<script>
function goToPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page' + page).classList.add('active');
}

function enterName() {
  let name = prompt("Enter your name:");
}

function chooseAttendance() {
  let choice = prompt("Joyfully Accept or Regretfully Decline");
}

function enterDiet() {
  let diet = prompt("Dietary restrictions:");
}

function openLetter() {
  document.getElementById('letterBox').style.display = 'block';
}

function sendMessage() {
  alert("Message sent!");
}

function submitRSVP() {
  let name = document.getElementById('rsvpName').value;
  let attend = document.getElementById('rsvpAttend').value;

  let data = JSON.parse(localStorage.getItem('guests') || '[]');
  data.push({name, attend});
  localStorage.setItem('guests', JSON.stringify(data));

  document.getElementById('thanks').innerText = "Thank you!";
}

let eventDate = new Date("May 8, 2026 15:00:00").getTime();

setInterval(() => {
  let now = new Date().getTime();
  let distance = eventDate - now;
  let days = Math.floor(distance / (1000 * 60 * 60 * 24));
  document.getElementById("countdown").innerText = days + " days left";
}, 1000);
</script>

</body>
</html>
