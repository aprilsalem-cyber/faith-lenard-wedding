<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding</title>

<style>
body {
  margin: 0;
  background: #f6eeee;
}

/* PAGE STYLE */
.page {
  display: none;
  width: 100%;
  height: 100vh;
}

.active {
  display: flex;
  justify-content: center;
  align-items: center;
}

/* IMAGE FIT (THIS FIXES ZOOM ISSUE) */
.page img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

/* NAV BUTTONS */
.nav {
  position: fixed;
  bottom: 20px;
  width: 100%;
  text-align: center;
}

button {
  padding: 10px 20px;
  margin: 5px;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
  <img src="page1.png">
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
  <img src="page2.png">
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
  <img src="page3.png">
</div>

<!-- PAGE 4 -->
<div id="page4" class="page">
  <img src="page4.png">
</div>

<!-- PAGE 5 -->
<div id="page5" class="page">
  <img src="page5.png">
</div>

<!-- NAVIGATION -->
<div class="nav">
  <button onclick="prevPage()">Previous</button>
  <button onclick="nextPage()">Next</button>
</div>

<script>
let current = 1;
let total = 5;

function showPage(num) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page' + num).classList.add('active');
}

function nextPage() {
  if (current < total) {
    current++;
    showPage(current);
  }
}

function prevPage() {
  if (current > 1) {
    current--;
    showPage(current);
  }
}
</script>

</body>
</html>
