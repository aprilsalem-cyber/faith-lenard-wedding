<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding</title>

<style>
body {
  margin: 0;
  background: #f6eeee;
  overflow-y: scroll; /* allow vertical scrolling for tall designs */
}

/* 🌸 EACH PAGE FULL WIDTH */
.page {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  padding: 20px 0; /* gives top and bottom space */
}

/* 🌸 IMAGE FIT WITHOUT CROPPING */
.page img {
  width: 100%;
  height: auto; /* keeps full image visible */
  max-width: 1200px; /* optional max size for large screens */
}

/* 🌸 Elegant navigation buttons */
.nav {
  position: fixed;
  bottom: 30px;
  width: 100%;
  text-align: center;
  z-index: 1000;
}

button {
  padding: 12px 25px;
  margin: 0 10px;
  font-size: 18px;
  font-family: 'Arial', sans-serif;
  font-weight: bold;
  color: #fff;
  background: linear-gradient(145deg, #800020, #b3002d);
  border: none;
  border-radius: 25px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}
</style>
</head>

<body>

<!-- 🌸 PAGES -->
<div id="page1" class="page">
  <img src="page1.png" alt="Page 1">
</div>
<div id="page2" class="page">
  <img src="page2.png" alt="Page 2">
</div>
<div id="page3" class="page">
  <img src="page3.png" alt="Page 3">
</div>
<div id="page4" class="page">
  <img src="page4.png" alt="Page 4">
</div>
<div id="page5" class="page">
  <img src="page5.png" alt="Page 5">
</div>

<!-- 🌸 NAVIGATION BUTTONS -->
<div class="nav">
  <button onclick="prevPage()">Previous</button>
  <button onclick="nextPage()">Next</button>
</div>

<script>
let current = 1;
let total = 5;

function showPage(num) {
  const pages = document.querySelectorAll('.page');
  pages.forEach(p => p.style.display = 'none');
  pages[num-1].style.display = 'flex';
}

function nextPage() {
  if (current < total) {
    current++;
    showPage(current);
    window.scrollTo(0,0); // scroll to top when switching pages
  }
}

function prevPage() {
  if (current > 1) {
    current--;
    showPage(current);
    window.scrollTo(0,0);
  }
}

// Show first page on load
showPage(current);
</script>

</body>
</html>
