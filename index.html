<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding</title>

<style>
/* 🌸 Reset & Background */
body {
  margin: 0;
  background: #f6eeee;
  scroll-behavior: smooth; /* smooth scrolling */
}

/* 🌸 Each page fills the screen */
.page {
  width: 100%;
  min-height: 100vh; /* full screen height */
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 🌸 Image fits perfectly */
.page img {
  width: 100vw;   /* full screen width */
  height: 100vh;  /* full screen height */
  object-fit: cover; /* fills screen, may crop slightly */
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page">
  <img src="page1.png" alt="Page 1">
</div>

<!-- PAGE 2 -->
<div class="page">
  <img src="page2.png" alt="Page 2">
</div>

<!-- PAGE 3 -->
<div class="page">
  <img src="page3.png" alt="Page 3">
</div>

<!-- PAGE 4 -->
<div class="page">
  <img src="page4.png" alt="Page 4">
</div>

<!-- PAGE 5 -->
<div class="page">
  <img src="page5.png" alt="Page 5">
</div>

</body>
</html>
