<!DOCTYPE html>
  <h1>Welcome</h1>
  <p class="finger">👉 Click the map</p>
  <a href="https://maps.app.goo.gl/owUoDmKXqvL2LkbC7" target="_blank">
    <img src="map.png" width="300">
  </a>
  <br><br>
  <button class="button" onclick="goToPage(9)">RSVP NOW</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
  <h2 onclick="enterName()">Click to Enter Name</h2>
  <p id="nameDisplay"></p>

  <h3 onclick="chooseAttendance()">Will you attend?</h3>
  <p id="attendance"></p>

  <h3 onclick="enterDiet()">Dietary Restrictions</h3>
  <p id="diet"></p>
</div>

<!-- PAGE 4 -->
<div class="page" id="page4">
  <h2 onclick="writeMessage()">Click to Write Message</h2>
  <p id="message"></p>
</div>

<!-- PAGE 5 -->
<div class="page" id="page5">
  <h2>Gift</h2>
  <button class="button" onclick="window.location.href='https://aprilsalem-cyber.github.io/gift-selection/?fbclid=IwY2xjawQ9-uBleHRuA2FlbQIxMABicmlkETFEU0ZaU2hZZ2l4UUdYWjBIc3J0YwZhcHBfaWQQMjIyMDM5MTc4ODIwMDg5MgABHiUs_PXEpfB5r7ColPOryZePnYTaL1-h1ki2qTcFmoAWMQam_a36i8R_0Kgv_aem_6WINKzTcXIpv5D3HlJx6xA'">Open Gift Page</button>
</div>

<!-- PAGE 9 -->
<div class="page" id="page9">
  <h2>RSVP Form</h2>
  <input type="text" id="finalName" placeholder="Your Name"><br><br>
  <button onclick="submitRSVP()">Submit</button>
  <p id="result"></p>
</div>

<script>
function goToPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page' + page).classList.add('active');
}

function enterName() {
  let name = prompt("Enter your name:");
  document.getElementById('nameDisplay').innerText = name;
}

function chooseAttendance() {
  let choice = prompt("Type: Accept or Decline");
  document.getElementById('attendance').innerText = choice;
}

function enterDiet() {
  let diet = prompt("Enter dietary restrictions:");
  document.getElementById('diet').innerText = diet;
}

function writeMessage() {
  let msg = prompt("Write your message:");
  document.getElementById('message').innerText = msg;
}

function submitRSVP() {
  let name = document.getElementById('finalName').value;
  let data = JSON.parse(localStorage.getItem('rsvpList') || '[]');
  data.push(name);
  localStorage.setItem('rsvpList', JSON.stringify(data));
  document.getElementById('result').innerText = "Thank you!";
}

// COUNTDOWN
let eventDate = new Date("Dec 31, 2026 00:00:00").getTime();
setInterval(() => {
  let now = new Date().getTime();
  let distance = eventDate - now;
  let days = Math.floor(distance / (1000 * 60 * 60 * 24));
  document.getElementById("countdown").innerText = days + " days left";
}, 1000);
</script>

</body>
</html>
