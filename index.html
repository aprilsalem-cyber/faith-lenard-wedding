<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding</title>

<style>
body {
  margin: 0;
  background: #f6eeee;
  font-family: Arial, sans-serif;
}

/* 🌸 Each page fills the width, scroll if taller */
.page {
  width: 100%;
  display: block; /* allow natural scroll */
  position: relative;
}

/* 🌸 Full-width image, keep original height */
.page img {
  width: 100%;
  height: auto;
  object-fit: none;
  display: block;
}

/* 🌸 Elegant navigation buttons */
.nav {
  position: fixed;
  bottom: 30px;
  width: 100%;
  text-align: center;
  z-index: 1000;
}

button {
  padding: 12px 25px;
  margin: 0 10px;
  font-size: 18px;
  font-weight: bold;
  color: #fff;
  background: linear-gradient(145deg, #800020, #b3002d); /* shiny burgundy gradient */
  border: none;
  border-radius: 25px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

/* 🌸 Finger icons */
.finger {
  position: absolute;
  width: 50px;
  animation: bounce 1.2s infinite alternate;
  z-index: 2000;
  cursor: pointer;
  filter: drop-shadow(0 0 5px #b3002d);
}

@keyframes bounce {
  0% { transform: translateY(0px); }
  100% { transform: translateY(-15px); }
}

/* 🌸 Countdown box */
#countdown {
  position: absolute;
  top: 20%;
  right: 15%;
  color: #b3002d;
  font-size: 32px;
  font-weight: bold;
  font-family: Arial, sans-serif;
  text-align: center;
  z-index: 2000;
  background: rgba(255,255,255,0.7);
  padding: 15px 25px;
  border-radius: 15px;
}

/* 🌸 Optional clickable cursor */
.clickable {
  cursor: pointer;
}
</style>
</head>
<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
  <img src="page1.png" alt="Page 1">
  
  <!-- Countdown -->
  <div id="countdown">00d 00h 00m 00s</div>

  <!-- Map clickable -->
  <a href="https://maps.app.goo.gl/8jwwaMsXphh9X5tg7" target="_blank" class="clickable" style="position:absolute; top:55%; left:60%; width:120px; height:120px;"></a>
  
  <!-- Finger pointing to map -->
  <img src="finger.png" class="finger" style="top:50%; left:55%;">

  <!-- RSVP button -->
  <button style="position:absolute; bottom:100px; right:30px;" onclick="goToPage(3)">RSVP NOW</button>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
  <img src="page2.png" alt="Page 2">
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
  <img src="page3.png" alt="Page 3">
</div>

<!-- PAGE 4 -->
<div id="page4" class="page">
  <img src="page4.png" alt="Page 4">
</div>

<!-- PAGE 5 -->
<div id="page5" class="page">
  <img src="page5.png" alt="Page 5">

  <!-- Gift clickable -->
  <a href="FZ9leHRuA2FlbQIxMABicmlkETFSZ3J2Y1BXTENIQWcwZDNYc3J0YwZhcHBfaWQQMjIyMDM5MTc4ODIwMDg5MgABHkBsELiPQClhLCWLQLzRPaH8l8d1lEXs0hdV6Eojy037Pz8k8h5e4d4kxmOR_aem_SoVQbdtBWgAyr_wympICRA" target="_blank" class="clickable" style="position:absolute; top:50%; left:50%; width:150px; height:150px;"></a>

  <!-- Finger pointing to gift -->
  <img src="finger.png" class="finger" style="top:45%; left:45%;">
</div>

<!-- NAVIGATION -->
<div class="nav">
  <button onclick="prevPage()">Previous</button>
  <button onclick="nextPage()">Next</button>
</div>

<script>
// ---------- PAGE NAVIGATION ----------
let current = 1;
let total = 5;

function showPage(num) {
  document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
  document.getElementById('page' + num).style.display = 'block';
  current = num;
}

function nextPage() {
  if (current < total) showPage(current + 1);
}

function prevPage() {
  if (current > 1) showPage(current - 1);
}

function goToPage(num) {
  showPage(num);
}

// ---------- COUNTDOWN ----------
const countdownEl = document.getElementById('countdown');
// Set your wedding date here
const weddingDate = new Date("2026-06-01T15:00:00"); 

function updateCountdown() {
  const now = new Date();
  let diff = weddingDate - now;
  if (diff < 0) diff = 0;

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / (1000 * 60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  countdownEl.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

setInterval(updateCountdown, 1000);
updateCountdown();
</script>

</body>
</html>
